language: en-US

early_access: false

enable_free_tier: true

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_instructions:
    - path: "**/*.js"
      instructions: |
        Review for correctness, regressions, maintainability, and Obsidian plugin lifecycle issues.
        Pay special attention to DOM cleanup, event listener disposal, mutation observers, timers,
        rendering performance, Mermaid compatibility, and accidental global side effects.
    - path: "**/*.test.js"
      instructions: |
        Verify tests cover observable behavior and edge cases. Flag brittle assertions,
        missing regression coverage, and tests that can pass without exercising the intended code path.
    - path: "manifest.json"
      instructions: |
        Verify the Obsidian plugin manifest remains valid and that metadata changes are intentional.
    - path: ".github/workflows/**"
      instructions: |
        Review GitHub Actions for least privilege, pinned major action versions, deterministic behavior,
        sensible timeouts, and unnecessary CI cost.

chat:
  auto_reply: true
