name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js 22
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check main.js
          node --check lib.js
          node --check lib.test.js

      - name: Run tests
        run: npm test

      - name: Validate plugin metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const required = [
            'id',
            'name',
            'version',
            'minAppVersion',
            'description',
            'author',
            'isDesktopOnly',
          ];

          for (const key of required) {
            if (!(key in manifest)) {
              throw new Error(`manifest.json is missing required field: ${key}`);
            }
          }

          if (typeof manifest.isDesktopOnly !== 'boolean') {
            throw new Error('manifest.json field "isDesktopOnly" must be a boolean');
          }

          if (!/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(manifest.version)) {
            throw new Error(`manifest.json has an invalid version: ${manifest.version}`);
          }

          if (!pkg.main || !fs.existsSync(pkg.main)) {
            throw new Error(`package.json main entry does not exist: ${pkg.main || '<missing>'}`);
          }
          NODE
