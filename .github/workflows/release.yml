name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    name: Publish Obsidian plugin release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const versions = JSON.parse(fs.readFileSync('versions.json', 'utf8'));
          const tag = process.env.RELEASE_TAG;

          if (tag !== manifest.version) {
            throw new Error(`Tag ${tag} does not match manifest.json version ${manifest.version}`);
          }

          if (pkg.version !== manifest.version) {
            throw new Error(`package.json version ${pkg.version} does not match manifest.json version ${manifest.version}`);
          }

          if (versions[manifest.version] !== manifest.minAppVersion) {
            throw new Error(
              `versions.json must map ${manifest.version} to ${manifest.minAppVersion}`,
            );
          }

          for (const file of ['main.js', 'manifest.json', 'styles.css']) {
            if (!fs.existsSync(file)) {
              throw new Error(`Required release file is missing: ${file}`);
            }
          }
          NODE

      - name: Build release archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: zip -j "mermaid-boost-${RELEASE_TAG}.zip" main.js manifest.json styles.css

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ASSETS=(
            main.js
            manifest.json
            styles.css
            "mermaid-boost-${RELEASE_TAG}.zip"
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
              --title "Mermaid Boost ${RELEASE_TAG}" \
              --generate-notes
          fi
